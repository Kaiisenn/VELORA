<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roblox Studio Mobile - Kaiisenn Edition</title>
  <style>
    :root {
      --bg: #000000;
      --panel: rgba(16, 16, 22, 0.85);
      --border: rgba(179, 136, 255, 0.28);
      --accent: #b388ff;
      --accent-dim: rgba(179, 136, 255, 0.18);
      --text: #f4f4f8;
      --muted: #8e8ea0;
      --danger: #ff5252;
      --success: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }

    .ribbon {
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 20;
      background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border); border-radius: 14px; padding: 6px 8px;
      display: flex; gap: 6px; overflow-x: auto; align-items: center;
    }
    .ribbon::-webkit-scrollbar { display: none; }
    .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
    
    .btn {
      background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 10px; border-radius: 9px; font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
      transition: transform 0.12s cubic-bezier(0.2, 1.4, 0.4, 1), background 0.15s;
    }
    .btn:active { transform: scale(0.92); }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn.play { background: rgba(0, 230, 118, 0.18); color: var(--success); border-color: rgba(0, 230, 118, 0.35); }
    .btn.stop { background: rgba(255, 82, 82, 0.22); color: var(--danger); border-color: rgba(255, 82, 82, 0.4); }
    .btn.danger { color: var(--danger); }

    .hud-badge {
      position: fixed; top: 56px; right: 10px; z-index: 15;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 5px 9px; font-size: 10px; color: var(--muted); pointer-events: none;
    }
    .hud-badge span { color: var(--accent); font-weight: 700; }

    .dock {
      position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 20;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; max-height: 38vh;
    }
    .dock-header { display: flex; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; }
    .tab { flex: 1; text-align: center; padding: 5px; font-size: 11px; color: var(--muted); border-radius: 7px; font-weight: 600; }
    .tab.active { background: var(--accent-dim); color: var(--accent); }
    .dock-body { overflow-y: auto; max-height: 27vh; padding-right: 2px; }

    .tree-item {
      padding: 6px 10px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px; background: rgba(255,255,255,0.03); border: 1px solid transparent;
    }
    .tree-item.selected { background: var(--accent-dim); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tree-tag { font-size: 10px; color: var(--muted); background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }

    .toolbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tool-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 11px; font-weight: 600;
    }
    .tool-card:active { background: var(--accent); color: #000; }
    .tool-card small { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    input[type="number"], input[type="text"], select, textarea {
      width: 100%; background: #0a0a0f; border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); padding: 6px 8px; border-radius: 7px; font-size: 12px; user-select: text;
    }
    input[type="color"] { width: 100%; height: 30px; border: none; border-radius: 7px; background: transparent; }
    textarea { font-family: monospace; height: 78px; resize: none; }
    .hidden { display: none !important; }

    #play-controls { position: fixed; inset: 0; z-index: 18; pointer-events: none; }
    .joy-zone {
      position: fixed; bottom: 28px; left: 24px; width: 110px; height: 110px;
      border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto; touch-action: none;
    }
    .joy-stick {
      position: absolute; top: 35px; left: 35px; width: 40px; height: 40px;
      border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px rgba(179,136,255,0.5);
    }
    .jump-btn {
      position: fixed; bottom: 38px; right: 28px; width: 76px; height: 76px;
      border-radius: 50%; background: rgba(179,136,255,0.25); border: 2px solid var(--accent);
      color: #fff; font-weight: 700; font-size: 12px; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
    }
    .jump-btn:active { background: var(--accent); color: #000; transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ribbon" id="studio-ribbon">
    <button class="btn play" id="play-btn" onclick="togglePlay()">Play</button>
    <div class="divider"></div>
    <button class="btn active" id="mode-select" onclick="setGizmoMode('select')">Select</button>
    <button class="btn" id="mode-translate" onclick="setGizmoMode('translate')">Move</button>
    <button class="btn" id="mode-scale" onclick="setGizmoMode('scale')">Scale</button>
    <button class="btn" id="mode-rotate" onclick="setGizmoMode('rotate')">Rotate</button>
    <div class="divider"></div>
    <button class="btn" onclick="spawnAsset('Part')">+ Part</button>
    <button class="btn" onclick="duplicateSelected()">Copy</button>
    <button class="btn danger" onclick="deleteSelected()">Del</button>
    <div class="divider"></div>
    <button class="btn" onclick="toggleSky()">Sky</button>
    <button class="btn" onclick="exportRBXLX()">Export .rbxlx</button>
  </div>

  <div class="hud-badge" id="hud-info">Mode: <span>Studio Edit</span></div>

  <div class="dock" id="studio-dock">
    <div class="dock-header">
      <div class="tab active" onclick="switchTab('explorer', this)">Explorer</div>
      <div class="tab" onclick="switchTab('props', this)">Properties</div>
      <div class="tab" onclick="switchTab('toolbox', this)">Toolbox</div>
      <div class="tab" onclick="switchTab('script', this)">Script</div>
    </div>

    <div class="dock-body">
      <div id="tab-explorer"></div>

      <div id="tab-props" class="hidden">
        <div id="no-sel" style="font-size:12px; color:var(--muted); text-align:center; padding:14px;">Pilih objek di 3D atau Explorer dulu.</div>
        <div id="inspector" class="hidden">
          <div class="grid-3">
            <div class="field"><label>Name</label><input type="text" id="prop-name" onchange="updateProps()" /></div>
            <div class="field"><label>Color</label><input type="color" id="prop-color" onchange="updateProps()" /></div>
            <div class="field"><label>Material</label>
              <select id="prop-mat" onchange="updateProps()">
                <option value="Plastic">Plastic</option>
                <option value="Neon">Neon</option>
                <option value="Metal">Metal</option>
                <option value="Glass">Glass</option>
              </select>
            </div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Pos X</label><input type="number" step="0.5" id="pos-x" onchange="updateProps()" /></div>
            <div class="field"><label>Pos Y</label><input type="number" step="0.5" id="pos-y" onchange="updateProps()" /></div>
            <div class="field"><label>Pos Z</label><input type="number" step="0.5" id="pos-z" onchange="updateProps()" /></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Scale X</label><input type="number" step="0.5" min="0.2" id="size-x" onchange="updateProps()" /></div>
            <div class="field"><label>Scale Y</label><input type="number" step="0.5" min="0.2" id="size-y" onchange="updateProps()" /></div>
            <div class="field"><label>Scale Z</label><input type="number" step="0.5" min="0.2" id="size-z" onchange="updateProps()" /></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Anchored</label><button class="btn" id="prop-anchor" onclick="togglePropBool('anchored')">True</button></div>
            <div class="field"><label>CanCollide</label><button class="btn" id="prop-collide" onclick="togglePropBool('canCollide')">True</button></div>
            <div class="field"><label>Focus Cam</label><button class="btn" onclick="focusSelected()">Zoom (F)</button></div>
          </div>
        </div>
      </div>

      <div id="tab-toolbox" class="hidden">
        <div class="toolbox-grid">
          <div class="tool-card" onclick="spawnAsset('Part')">Block<small>Standard Part</small></div>
          <div class="tool-card" onclick="spawnAsset('Sphere')">Sphere<small>Ball Part</small></div>
          <div class="tool-card" onclick="spawnAsset('Cylinder')">Cylinder<small>Round Pillar</small></div>
          <div class="tool-card" onclick="spawnAsset('Wedge')">Wedge<small>Ramp / Tanjakan</small></div>
          <div class="tool-card" onclick="spawnAsset('SpawnLocation')">Spawn<small>Titik Muncul</small></div>
          <div class="tool-card" onclick="spawnAsset('NeonBlock')">Neon Pad<small>Glow Obby</small></div>
        </div>
      </div>

      <div id="tab-script" class="hidden">
        <div class="field">
          <label>Workspace Runtime Script (Jalan otomatis saat klik Play)</label>
          <textarea id="code-editor">// Contoh: Bikin objek Neon muter pas Play
parts.forEach(p => {
  if (p.userData.materialType === 'Neon') {
    p.rotation.y += 0.03;
  }
});</textarea>
        </div>
      </div>
    </div>
  </div>

  <div id="play-controls" class="hidden">
    <div class="joy-zone" id="joy-zone"><div class="joy-stick" id="joy-stick"></div></div>
    <div class="jump-btn" id="jump-btn">JUMP</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

  <script>
    let scene, camera, renderer, orbit, gizmo, raycaster, mouse;
    let parts = [];
    let selected = null;
    let baseplate = null;
    let isPlaying = false;
    let isDaySky = false;
    let studTexture;
    let counter = 1;

    let playerGroup = null;
    let playerVel = new THREE.Vector3();
    let isGrounded = false;
    let joyInput = { x: 0, y: 0 };

    function createStudTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 128, 128);
      ctx.beginPath();
      ctx.arc(64, 64, 34, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x07070c);
      scene.fog = new THREE.FogExp2(0x07070c, 0.008);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(12, 12, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      orbit = new THREE.OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.dampingFactor = 0.08;

      gizmo = new THREE.TransformControls(camera, renderer.domElement);
      gizmo.setSize(1.1);
      gizmo.addEventListener('dragging-changed', (e) => {
        orbit.enabled = !e.value;
        if (!e.value && selected) syncInspector();
      });
      gizmo.addEventListener('change', () => {
        if (selected && gizmo.dragging) syncInspector();
      });
      scene.add(gizmo);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 0.75);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(20, 35, 15);
      dir.castShadow = true;
      scene.add(dir);

      studTexture = createStudTexture();

      const bpTex = studTexture.clone();
      bpTex.repeat.set(32, 32);
      bpTex.needsUpdate = true;
      const bpGeo = new THREE.BoxGeometry(64, 1, 64);
      const bpMat = new THREE.MeshStandardMaterial({ color: 0x2c2c38, map: bpTex, roughness: 0.85 });
      baseplate = new THREE.Mesh(bpGeo, bpMat);
      baseplate.position.y = -0.5;
      baseplate.receiveShadow = true;
      scene.add(baseplate);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      renderer.domElement.addEventListener('pointerdown', onCanvasTap);
      window.addEventListener('resize', onResize);
      setupTouchControls();

      spawnAsset('SpawnLocation');
      const b1 = spawnAsset('Part');
      b1.position.set(0, 1.5, -6);
      const b2 = spawnAsset('NeonBlock');
      b2.position.set(0, 3, -12);

      selectPart(parts[0]);
      animate();
    }
    function createWedgeGeometry(w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        if (pos.getY(i) > 0 && pos.getZ(i) < 0) {
          pos.setY(i, -h / 2);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

    function spawnAsset(type) {
      let geo, color = 0xa3a2a5, matType = 'Plastic', name = type + counter++;
      const tex = studTexture.clone();
      tex.repeat.set(2, 1);
      tex.needsUpdate = true;

      if (type === 'Sphere') {
        geo = new THREE.SphereGeometry(1.2, 24, 24);
      } else if (type === 'Cylinder') {
        geo = new THREE.CylinderGeometry(1.2, 1.2, 3, 24);
      } else if (type === 'Wedge') {
        geo = createWedgeGeometry(4, 2, 4);
      } else if (type === 'SpawnLocation') {
        geo = new THREE.BoxGeometry(5, 0.4, 5);
        color = 0x3a3a4a;
        name = 'SpawnLocation';
      } else if (type === 'NeonBlock') {
        geo = new THREE.BoxGeometry(4, 0.8, 4);
        color = 0xb388ff;
        matType = 'Neon';
        name = 'NeonPad' + counter;
      } else {
        geo = new THREE.BoxGeometry(4, 1, 2);
      }

      const mat = buildMaterial(color, matType, tex);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, 0.6 + (parts.length * 0.2), 0);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      mesh.userData = {
        name,
        shape: type,
        materialType: matType,
        anchored: true,
        canCollide: true,
        baseColor: color,
        studTex: tex,
        savedPos: mesh.position.clone(),
        savedRot: mesh.rotation.clone()
      };

      scene.add(mesh);
      parts.push(mesh);
      renderExplorer();
      selectPart(mesh);
      return mesh;
    }

    function buildMaterial(hexColor, matType, tex) {
      if (matType === 'Neon') {
        return new THREE.MeshStandardMaterial({
          color: hexColor, emissive: hexColor, emissiveIntensity: 0.75, roughness: 0.2
        });
      } else if (matType === 'Metal') {
        return new THREE.MeshStandardMaterial({
          color: hexColor, map: tex, metalness: 0.8, roughness: 0.25
        });
      } else if (matType === 'Glass') {
        return new THREE.MeshStandardMaterial({
          color: hexColor, transparent: true, opacity: 0.45, roughness: 0.1
        });
      }
      return new THREE.MeshStandardMaterial({
        color: hexColor, map: tex, roughness: 0.65, metalness: 0.05
      });
    }

    function selectPart(mesh) {
      if (isPlaying) return;
      selected = mesh;
      const insp = document.getElementById('inspector');
      const noSel = document.getElementById('no-sel');

      if (!selected) {
        gizmo.detach();
        insp.classList.add('hidden');
        noSel.classList.remove('hidden');
        renderExplorer();
        return;
      }

      gizmo.attach(selected);
      noSel.classList.add('hidden');
      insp.classList.remove('hidden');
      syncInspector();
      renderExplorer();
    }

    function syncInspector() {
      if (!selected) return;
      document.getElementById('prop-name').value = selected.userData.name;
      document.getElementById('prop-color').value = '#' + new THREE.Color(selected.userData.baseColor).getHexString();
      document.getElementById('prop-mat').value = selected.userData.materialType;

      document.getElementById('pos-x').value = selected.position.x.toFixed(2);
      document.getElementById('pos-y').value = selected.position.y.toFixed(2);
      document.getElementById('pos-z').value = selected.position.z.toFixed(2);

      document.getElementById('size-x').value = selected.scale.x.toFixed(2);
      document.getElementById('size-y').value = selected.scale.y.toFixed(2);
      document.getElementById('size-z').value = selected.scale.z.toFixed(2);

      document.getElementById('prop-anchor').textContent = selected.userData.anchored ? 'True' : 'False';
      document.getElementById('prop-collide').textContent = selected.userData.canCollide ? 'True' : 'False';
    }

    function updateProps() {
      if (!selected) return;
      selected.userData.name = document.getElementById('prop-name').value || 'Part';
      const hex = new THREE.Color(document.getElementById('prop-color').value).getHex();
      const matType = document.getElementById('prop-mat').value;
      selected.userData.baseColor = hex;
      selected.userData.materialType = matType;
      selected.material = buildMaterial(hex, matType, selected.userData.studTex);

      selected.position.set(
        parseFloat(document.getElementById('pos-x').value) || 0,
        parseFloat(document.getElementById('pos-y').value) || 0,
        parseFloat(document.getElementById('pos-z').value) || 0
      );
      selected.scale.set(
        Math.max(0.1, parseFloat(document.getElementById('size-x').value) || 1),
        Math.max(0.1, parseFloat(document.getElementById('size-y').value) || 1),
        Math.max(0.1, parseFloat(document.getElementById('size-z').value) || 1)
      );
      renderExplorer();
    }

    function togglePropBool(key) {
      if (!selected) return;
      selected.userData[key] = !selected.userData[key];
      syncInspector();
    }

    function setGizmoMode(mode) {
      document.querySelectorAll('#studio-ribbon .btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mode-' + mode).classList.add('active');
      if (mode === 'select') {
        gizmo.visible = false;
        gizmo.enabled = false;
      } else {
        gizmo.visible = true;
        gizmo.enabled = true;
        gizmo.setMode(mode);
      }
    }

    function focusSelected() {
      if (!selected) return;
      orbit.target.copy(selected.position);
      camera.position.copy(selected.position).add(new THREE.Vector3(6, 5, 8));
    }

    function duplicateSelected() {
      if (!selected) return;
      const clone = selected.clone();
      clone.material = selected.material.clone();
      clone.position.y += 1.5;
      clone.userData = {
        ...selected.userData,
        name: selected.userData.name + '_Copy'
      };
      scene.add(clone);
      parts.push(clone);
      renderExplorer();
      selectPart(clone);
    }

    function deleteSelected() {
      if (!selected) return;
      scene.remove(selected);
      parts = parts.filter(p => p !== selected);
      selectPart(null);
    }

    function renderExplorer() {
      const box = document.getElementById('tab-explorer');
      let html = `<div class="tree-item" style="opacity:0.7"><span>Workspace</span><span class="tree-tag">Service</span></div>`;
      html += `<div class="tree-item" style="padding-left:20px; opacity:0.7"><span>Baseplate</span><span class="tree-tag">Part</span></div>`;
      parts.forEach((p, idx) => {
        const isSel = selected === p ? 'selected' : '';
        html += `<div class="tree-item ${isSel}" style="padding-left:20px" onclick="selectPart(parts[${idx}])">
          <span>${p.userData.name}</span>
          <span class="tree-tag">${p.userData.shape}</span>
        </div>`;
      });
      box.innerHTML = html;
    }

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['explorer', 'props', 'toolbox', 'script'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
      });
    }

    function toggleSky() {
      isDaySky = !isDaySky;
      const col = isDaySky ? 0x74b9ff : 0x07070c;
      scene.background = new THREE.Color(col);
      scene.fog = new THREE.FogExp2(col, isDaySky ? 0.004 : 0.008);
    }

    function onCanvasTap(e) {
      if (isPlaying || gizmo.dragging) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(parts);
      if (hits.length > 0) selectPart(hits[0].object);
    }

    function spawnCharacter() {
      playerGroup = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.6, 0.7), new THREE.MeshStandardMaterial({ color: 0x0984e3 }));
      torso.position.y = 1.8;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: 0xffeaa7 }));
      head.position.y = 3.1;
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x00b894 }));
      legL.position.set(-0.38, 0.6, 0);
      const legR = legL.clone();
      legR.position.x = 0.38;

      playerGroup.add(torso, head, legL, legR);

      const spawnObj = parts.find(p => p.userData.shape === 'SpawnLocation');
      if (spawnObj) {
        playerGroup.position.copy(spawnObj.position).add(new THREE.Vector3(0, 0.5, 0));
      } else {
        playerGroup.position.set(0, 1, 4);
      }
      playerVel.set(0, 0, 0);
      scene.add(playerGroup);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      const dock = document.getElementById('studio-dock');
      const playCtrl = document.getElementById('play-controls');
      const hud = document.getElementById('hud-info');

      if (isPlaying) {
        btn.textContent = 'Stop';
        btn.className = 'btn stop';
        dock.classList.add('hidden');
        playCtrl.classList.remove('hidden');
        gizmo.detach();
        hud.innerHTML = 'Mode: <span>Playtest (Analog + Jump)</span>';
        parts.forEach(p => {
          p.userData.savedPos = p.position.clone();
          p.userData.savedRot = p.rotation.clone();
        });
        spawnCharacter();
      } else {
        btn.textContent = 'Play';
        btn.className = 'btn play';
        dock.classList.remove('hidden');
        playCtrl.classList.add('hidden');
        hud.innerHTML = 'Mode: <span>Studio Edit</span>';
        if (playerGroup) { scene.remove(playerGroup); playerGroup = null; }
        parts.forEach(p => {
          p.position.copy(p.userData.savedPos);
          p.rotation.copy(p.userData.savedRot);
        });
        if (selected) gizmo.attach(selected);
      }
    }

    function setupTouchControls() {
      const zone = document.getElementById('joy-zone');
      const stick = document.getElementById('joy-stick');
      const jumpBtn = document.getElementById('jump-btn');

      zone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = zone.getBoundingClientRect();
        const t = e.touches[0];
        let dx = t.clientX - (rect.left + 55);
        let dy = t.clientY - (rect.top + 55);
        const dist = Math.min(35, Math.hypot(dx, dy));
        const ang = Math.atan2(dy, dx);
        const sx = Math.cos(ang) * dist;
        const sy = Math.sin(ang) * dist;
        stick.style.transform = `translate(${sx}px, ${sy}px)`;
        joyInput.x = sx / 35;
        joyInput.y = sy / 35;
      }, { passive: false });

      zone.addEventListener('touchend', () => {
        stick.style.transform = 'translate(0px, 0px)';
        joyInput.x = 0; joyInput.y = 0;
      });

      jumpBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGrounded) {
          playerVel.y = 0.34;
          isGrounded = false;
        }
      });
    }

    function updatePlayPhysics() {
      if (!playerGroup) return;
      const speed = 0.22;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

      const move = new THREE.Vector3()
        .addScaledVector(forward, -joyInput.y * speed)
        .addScaledVector(right, joyInput.x * speed);

      if (move.lengthSq() > 0.0001) {
        playerGroup.position.add(move);
        playerGroup.rotation.y = Math.atan2(move.x, move.z);
      }

      playerVel.y -= 0.018;
      playerGroup.position.y += playerVel.y;

      let floorY = 0;
      const pPos = playerGroup.position;
      parts.forEach(part => {
        if (!part.userData.canCollide) return;
        const box = new THREE.Box3().setFromObject(part);
        if (pPos.x >= box.min.x - 0.4 && pPos.x <= box.max.x + 0.4 &&
            pPos.z >= box.min.z - 0.4 && pPos.z <= box.max.z + 0.4) {
          if (pPos.y >= box.max.y - 0.5 && box.max.y > floorY) {
            floorY = box.max.y;
          }
        }
      });

      if (playerGroup.position.y <= floorY) {
        playerGroup.position.y = floorY;
        playerVel.y = 0;
        isGrounded = true;
      }

      if (playerGroup.position.y < -25) {
        playerGroup.position.set(0, 5, 4);
        playerVel.set(0, 0, 0);
      }

      orbit.target.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
    }

    function exportRBXLX() {
      let itemsXml = '';
      parts.forEach((p, idx) => {
        const hex = p.userData.baseColor;
        const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
        const colorUint8 = ((255 << 24) | (r << 16) | (g << 8) | b) >>> 0;
        const box = new THREE.Box3().setFromObject(p);
        const size = new THREE.Vector3();
        box.getSize(size);
        const className = p.userData.shape === 'SpawnLocation' ? 'SpawnLocation' : (p.userData.shape === 'Wedge' ? 'WedgePart' : 'Part');

        itemsXml += `
    <Item class="${className}" referent="RBX${idx + 1}">
      <Properties>
        <string name="Name">${p.userData.name}</string>
        <bool name="Anchored">${p.userData.anchored}</bool>
        <bool name="CanCollide">${p.userData.canCollide}</bool>
        <CoordinateFrame name="CFrame">
          <X>${p.position.x}</X><Y>${p.position.y}</Y><Z>${p.position.z}</Z>
          <R00>1</R00><R01>0</R01><R02>0</R02>
          <R10>0</R10><R11>1</R11><R12>0</R12>
          <R20>0</R20><R21>0</R21><R22>1</R22>
        </CoordinateFrame>
        <Vector3 name="size"><X>${size.x.toFixed(2)}</X><Y>${size.y.toFixed(2)}</Y><Z>${size.z.toFixed(2)}</Z></Vector3>
        <Color3uint8 name="Color3uint8">${colorUint8}</Color3uint8>
      </Properties>
    </Item>`;
      });

      const fullXml = `<?xml version="1.0" encoding="utf-8"?>
<roblox version="4">
  <Item class="Workspace" referent="RBX0">
    <Properties><string name="Name">Workspace</string></Properties>${itemsXml}
  </Item>
</roblox>`;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([fullXml], { type: 'application/xml' }));
      a.download = 'KaiisennStudio.rbxlx';
      a.click();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isPlaying) {
        try {
          const fn = new Function('parts', document.getElementById('code-editor').value);
          fn(parts);
        } catch (e) {}
        updatePlayPhysics();
      }
      orbit.update();
      renderer.render(scene, camera);
    }

    init();
    setGizmoMode('translate');
  </script>
</body>
</html>
